# MedGuardian AI — MVP 1 configuration
# Every threshold that governs a product decision lives here, not buried in
# code — Section 4.3 and Section 7 of the product proposal name these values
# explicitly, so they're testable and reviewable on their own.

app:
  name: MedGuardian AI
  version: "1.0.0"
  phase: "Phase 1 — MVP"

condition:
  name: "Type 2 diabetes with cardiometabolic comorbidities"
  language: en

data:
  # Resolved relative to this config.yaml file's own directory (mvp1/), not
  # relative to whichever module loads it.
  orange_book_drugs: ../data/orange_book_drugs.csv
  orange_book_interactions: ../data/orange_book_interactions.csv
  # Real, FDA-sourced drug-label interaction text (openfda_interactions_fetcher.py).
  # Not structured pairwise data — see src/fda_reference.py for what this is and isn't.
  fda_reference_text: ../data/openfda_interaction_warnings.csv

# Section 4.3 — MVP Strategy: the graduation gate from Phase 1 to Phase 2.
# Automation does not expand until both are met over a 60-day pilot.
acceptance_gates:
  pharmacist_agreement_min: 0.95
  false_positive_rate_max: 0.05
  pilot_duration_days: 60

# Section 7 — Metrics Framework, Phase 1 subset.
kpi_thresholds:
  adherence_rate_min: 0.85
  alerts_acted_on_min: 0.70
  false_positive_rate_max: 0.05
  pharmacist_review_turnaround_hours_max: 2

adherence:
  seed_days: 13
  seed_taken_ratio: 0.82

theme:
  denim: "#0A53BE"
  prussian: "#001C4A"
  cornflower: "#94BFE7"
  anakiwa: "#A8D5FF"
  pampas: "#F1ECE9"
  white: "#FFFFFF"
